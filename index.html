<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5FAF8A">
<link rel="manifest" href="./manifest.json">

<title>Система планирования</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #26352d;
}

.app {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  background: white;
  padding-bottom: 85px;
}

.header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #edf1ee;
}

.avatar {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #e3f0e9;
  font-size: 20px;
}

.header-center {
  flex: 1;
}

.title {
  font-weight: bold;
  font-size: 18px;
}

.date {
  color: #89958e;
  font-size: 12px;
  margin-top: 3px;
}

.icon {
  border: 0;
  background: transparent;
  font-size: 20px;
}

.page {
  display: none;
  padding: 18px;
}

.page.active {
  display: block;
}

h2 {
  margin-top: 0;
}

.subtitle {
  color: #89958e;
  font-size: 14px;
}

.today {
  background: #f0f7f3;
  padding: 16px;
  border-radius: 18px;
  margin: 18px 0;
}

.today-title {
  color: #718078;
  font-size: 12px;
}

.today-date {
  font-size: 20px;
  font-weight: bold;
  margin: 8px 0 14px;
}

.task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px;
  margin-bottom: 9px;
  border: 1px solid #edf0ee;
  border-radius: 14px;
  background: white;
}

.check {
  width: 23px;
  height: 23px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 2px solid #b9c8c0;
  background: white;
}

.check.important {
  border-color: #e95f63;
}

.check.secondary {
  border-color: #5FAF8A;
}

.check.note {
  border-color: #8aa8bd;
}

.task-content {
  flex: 1;
}

.task-text {
  font-size: 15px;
  line-height: 1.35;
}

.task-text.important {
  color: #d94e53;
  font-weight: bold;
  text-transform: uppercase;
}

.task-text.secondary {
  color: #408060;
}

.task-text.note {
  color: #6e7e87;
}

.meta {
  margin-top: 5px;
  font-size: 11px;
  color: #89958e;
}

.actions button {
  border: 0;
  background: transparent;
  padding: 4px;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 15px 0;
}

.tab {
  border: 0;
  border-radius: 20px;
  padding: 9px 15px;
  background: #f1f4f2;
  color: #6e7b74;
}

.tab.active {
  background: #5FAF8A;
  color: white;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.month {
  font-size: 20px;
  font-weight: bold;
}

.month button {
  border: 0;
  background: #eef5f1;
  width: 35px;
  height: 35px;
  border-radius: 10px;
  font-size: 20px;
}

.weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekday {
  text-align: center;
  padding: 9px 0;
  font-size: 11px;
  color: #89958e;
}

.day {
  min-height: 65px;
  padding: 5px;
  border: 1px solid #f0f2f1;
  font-size: 11px;
}

.day.today-day {
  background: #eaf5ef;
}

.day-number {
  font-weight: bold;
}

.dot {
  margin-top: 4px;
  font-size: 8px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.dot.important {
  color: #d94e53;
}

.dot.secondary {
  color: #408060;
}

.dot.note {
  color: #637f91;
}

.empty {
  text-align: center;
  padding: 25px 10px;
  color: #9aa59f;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 20px 0;
}

.stat {
  background: #f5f8f6;
  border-radius: 15px;
  padding: 14px 5px;
  text-align: center;
}

.stat-number {
  font-size: 22px;
  font-weight: bold;
}

.stat-label {
  color: #89958e;
  font-size: 11px;
}

.profile-avatar {
  width: 75px;
  height: 75px;
  margin: 10px auto;
  border-radius: 50%;
  background: #e3f0e9;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 35px;
}

.profile-name {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.profile-sub {
  text-align: center;
  color: #89958e;
  font-size: 13px;
}

.profile-menu button {
  width: 100%;
  border: 0;
  background: #f7f9f8;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 8px;
  text-align: left;
}

.add-button {
  position: fixed;
  bottom: 75px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 36px);
  max-width: 430px;
  height: 52px;
  border: 0;
  border-radius: 17px;
  background: #5FAF8A;
  color: white;
  font-weight: bold;
  z-index: 20;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 67px;
  background: white;
  border-top: 1px solid #edf0ee;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 30;
}

.nav {
  border: 0;
  background: transparent;
  color: #929c97;
  font-size: 10px;
}

.nav span {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}

.nav.active {
  color: #4b9a75;
  font-weight: bold;
}

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,45,38,.4);
  z-index: 100;
  align-items: flex-end;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 480px;
  margin: auto;
  background: white;
  border-radius: 25px 25px 0 0;
  padding: 20px;
}

.modal h2 {
  margin-bottom: 18px;
}

.priority {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
  margin-bottom: 14px;
}

.priority button {
  border: 2px solid transparent;
  background: #f2f4f3;
  padding: 10px 3px;
  border-radius: 12px;
  font-size: 12px;
}

.priority button.selected.important {
  border-color: #e95f63;
}

.priority button.selected.secondary {
  border-color: #5FAF8A;
}

.priority button.selected.note {
  border-color: #8aa8bd;
}

textarea,
input {
  width: 100%;
  border: 1px solid #dfe6e1;
  border-radius: 13px;
  padding: 12px;
  background: #fafcfb;
  margin-bottom: 10px;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

.date-time {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.permanent {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.permanent input {
  width: 18px;
  margin: 0;
}

.modal-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}

.modal-buttons button {
  border: 0;
  padding: 13px;
  border-radius: 13px;
  font-weight: bold;
}

.cancel {
  background: #f0f3f1;
}

.save {
  background: #5FAF8A;
  color: white;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 145px;
  transform: translateX(-50%);
  background: #26352d;
  color: white;
  padding: 11px 16px;
  border-radius: 13px;
  display: none;
  z-index: 200;
}

.toast.show {
  display: block;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<button class="avatar" onclick="showPage('profile')">
👤
</button>

<div class="header-center">
<div class="title">Система планирования</div>
<div class="date" id="headerDate"></div>
</div>

<button class="icon" onclick="showToast('Настройки появятся позже')">⚙️</button>
<button class="icon" onclick="showPage('completed')">🗂️</button>

</header>


<!-- ГЛАВНАЯ -->

<section id="home" class="page active">

<h2>Мои планы</h2>

<div class="subtitle">
Запиши. Расставь приоритет. Не забудь. Выполни.
</div>

<div class="today">

<div class="today-title">СЕГОДНЯ</div>

<div class="today-date" id="todayDate"></div>

<div id="todayTasks"></div>

</div>

<h3>Категории</h3>

<div class="tabs">

<button class="tab active" onclick="setCategory('important',this)">
Важные
</button>

<button class="tab" onclick="setCategory('secondary',this)">
Побочные
</button>

<button class="tab" onclick="setCategory('note',this)">
Заметки
</button>

</div>

<div id="categoryTasks"></div>

</section>


<!-- КАЛЕНДАРЬ -->

<section id="calendarPage" class="page">

<div class="calendar-header">

<div class="month" id="monthTitle"></div>

<div>
<button onclick="changeMonth(-1)">‹</button>
<button onclick="changeMonth(1)">›</button>
</div>

</div>

<div class="weekdays">
<div class="weekday">ПН</div>
<div class="weekday">ВТ</div>
<div class="weekday">СР</div>
<div class="weekday">ЧТ</div>
<div class="weekday">ПТ</div>
<div class="weekday">СБ</div>
<div class="weekday">ВС</div>
</div>

<div id="calendarGrid" class="calendar-grid"></div>

<h3>Задачи месяца</h3>

<div id="monthTasks"></div>

</section>


<!-- ВЫПОЛНЕНО -->

<section id="completed" class="page">

<h2>Выполненные задачи</h2>

<div class="subtitle">
Здесь хранится история выполненных планов.
</div>

<div id="completedTasks"></div>

</section>


<!-- ПРОФИЛЬ -->

<section id="profile" class="page">

<div class="profile-avatar">👤</div>

<div class="profile-name">
Мой профиль
</div>

<div class="profile-sub">
Личная эффективность
</div>

<div class="stats">

<div class="stat">
<div class="stat-number" id="totalCount">0</div>
<div class="stat-label">Всего</div>
</div>

<div class="stat">
<div class="stat-number" id="doneCount">0</div>
<div class="stat-label">Выполнено</div>
</div>

<div class="stat">
<div class="stat-number" id="importantCount">0</div>
<div class="stat-label">Важных</div>
</div>

</div>

<div class="profile-menu">

<button onclick="showPage('completed')">
✅ История выполненных задач
</button>

<button onclick="showToast('Данные сохраняются на этом устройстве')">
💾 Хранение данных
</button>

<button onclick="clearCompleted()">
🗑️ Очистить выполненные
</button>

</div>

</section>


<button class="add-button" onclick="openModal()">
＋ Добавить задачу
</button>


<nav class="bottom">

<button class="nav active" onclick="showPage('home')">
<span>⌂</span>
Главная
</button>

<button class="nav" onclick="showPage('calendarPage')">
<span>▦</span>
Календарь
</button>

<button class="nav" onclick="openModal()">
<span>＋</span>
Добавить
</button>

<button class="nav" onclick="showPage('completed')">
<span>✓</span>
Выполнено
</button>

<button class="nav" onclick="showPage('profile')">
<span>●</span>
Профиль
</button>

</nav>

</div>


<!-- ОКНО ДОБАВЛЕНИЯ -->

<div id="modalBg" class="modal-bg">

<div class="modal">

<h2 id="modalTitle">Новая задача</h2>

<div class="priority">

<button class="selected important"
onclick="selectPriority('important',this)">
🔴 Важная
</button>

<button class="secondary"
onclick="selectPriority('secondary',this)">
🟢 Побочная
</button>

<button class="note"
onclick="selectPriority('note',this)">
🔵 Заметка
</button>

</div>

<textarea
id="taskText"
placeholder="Введите задачу..."
></textarea>

<div class="date-time">

<input type="date" id="taskDate">

<input type="time" id="taskTime">

</div>

<label class="permanent">

<input type="checkbox" id="permanent">

Постоянная задача

</label>

<div class="modal-buttons">

<button class="cancel" onclick="closeModal()">
Отмена
</button>

<button class="save" onclick="saveTask()">
Сохранить
</button>

</div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

const STORAGE = "planningTasksFinal";

let tasks = JSON.parse(localStorage.getItem(STORAGE) || "null");

let category = "important";

let priority = "important";

let editId = null;

let calendarDate = new Date();

const months = [
"Январь","Февраль","Март","Апрель","Май","Июнь",
"Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
];

const genitive = [
"января","февраля","марта","апреля","мая","июня",
"июля","августа","сентября","октября","ноября","декабря"
];


function dateString(date) {

return date.getFullYear() + "-" +
String(date.getMonth()+1).padStart(2,"0") + "-" +
String(date.getDate()).padStart(2,"0");

}


function prettyDate(value) {

if (!value) return "";

const parts = value.split("-");

return Number(parts[2]) + " " +
genitive[Number(parts[1])-1];

}


function today() {

return dateString(new Date());

}


if (!tasks) {

tasks = [

{
id: 1,
text: "Поздравить Бабу Зину",
priority: "important",
date: today(),
time: "16:00",
permanent: false,
completed: false
},

{
id: 2,
text: "Забрать ноутбук с ремонта",
priority: "important",
date: today(),
time: "17:00",
permanent: false,
completed: false
},

{
id: 3,
text: "Помыть пол до прихода жены",
priority: "secondary",
date: today(),
time: "20:00",
permanent: false,
completed: false
},

{
id: 4,
text: "#дома отключают свет до 16",
priority: "note",
date: today(),
time: "",
permanent: false,
completed: false
}

];

save();

}


function save() {

localStorage.setItem(
STORAGE,
JSON.stringify(tasks)
);

}


function showPage(id) {

document.querySelectorAll(".page")
.forEach(page => page.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll(".nav")
.forEach(button => button.classList.remove("active"));

const indexes = {
home: 0,
calendarPage: 1,
completed: 3,
profile: 4
};

if (indexes[id] !== undefined) {

document.querySelectorAll(".nav")[indexes[id]]
.classList.add("active");

}

render();

}


function openModal(task = null) {

editId = task ? task.id : null;

document.getElementById("modalTitle")
.textContent = task ? "Редактирование" : "Новая задача";

document.getElementById("taskText")
.value = task ? task.text : "";

document.getElementById("taskDate")
.value = task ? task.date : today();

document.getElementById("taskTime")
.value = task ? task.time : "";

document.getElementById("permanent")
.checked = task ? task.permanent : false;

priority = task ? task.priority : "important";

document.querySelectorAll(".priority button")
.forEach(button => button.classList.remove("selected"));

document.querySelector(
`.priority .${priority}`
).classList.add("selected");

document.getElementById("modalBg")
.classList.add("show");

}


function closeModal() {

document.getElementById("modalBg")
.classList.remove("show");

editId = null;

}


function selectPriority(value, button) {

priority = value;

document.querySelectorAll(".priority button")
.forEach(b => b.classList.remove("selected"));

button.classList.add("selected");

}


function saveTask() {

const text =
document.getElementById("taskText").value.trim();

const date =
document.getElementById("taskDate").value;

const time =
document.getElementById("taskTime").value;

const permanent =
document.getElementById("permanent").checked;


if (!text) {

showToast("Введите задачу");

return;

}


if (!date) {

showToast("Выберите дату");

return;

}


if (editId) {

const task =
tasks.find(t => t.id === editId);

task.text = text;
task.priority = priority;
task.date = date;
task.time = time;
task.permanent = permanent;

showToast("Задача изменена");

} else {

tasks.push({

id: Date.now(),

text,
priority,
date,
time,
permanent,
completed: false

});

showToast("Задача создана ✓");

}


save();

closeModal();

render();

}


function completeTask(id) {

const task =
tasks.find(t => t.id === id);

if (!task) return;

task.completed = true;

task.completedAt =
new Date().toISOString();

save();

showToast("Задача выполнена ✓");

render();

}


function deleteTask(id) {

if (!confirm("Удалить задачу?")) return;

tasks =
tasks.filter(t => t.id !== id);

save();

showToast("Задача удалена");

render();

}


function editTask(id) {

const task =
tasks.find(t => t.id === id);

if (task) openModal(task);

}


function taskHTML(task, completed=false) {

return `

<div class="task">

<button
class="check ${task.priority}"
onclick="${completed ? "" : `completeTask(${task.id})`}"
></button>

<div class="task-content">

<div class="task-text ${task.priority}">
${escapeHTML(task.text)}
</div>

<div class="meta">

${task.date ? "📅 " + prettyDate(task.date) : ""}

${task.time ? " · ⏰ " + task.time : ""}

${task.permanent ? " · 🔄 постоянно" : ""}

${completed ? " · ✓ выполнено" : ""}

</div>

</div>

${completed ? "" : `

<div class="actions">

<button onclick="editTask(${task.id})">✏️</button>

<button onclick="deleteTask(${task.id})">🗑️</button>

</div>

`}

</div>

`;

}


function escapeHTML(text) {

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function setCategory(value, button) {

category = value;

document.querySelectorAll(".tab")
.forEach(b => b.classList.remove("active"));

button.classList.add("active");

renderCategory();

}


function renderToday() {

const container =
document.getElementById("todayTasks");

const list =
tasks
.filter(t => !t.completed && t.date === today())
.sort(sortTasks);


container.innerHTML =
list.length
? list.map(t => taskHTML(t)).join("")
: `<div class="empty">На сегодня планов нет 🌿</div>`;

}


function renderCategory() {

const container =
document.getElementById("categoryTasks");

const list =
tasks
.filter(t => !t.completed && t.priority === category)
.sort(sortTasks);


container.innerHTML =
list.length
? list.map(t => taskHTML(t)).join("")
: `<div class="empty">В этой категории пока нет задач.</div>`;

}


function sortTasks(a,b) {

return (a.date + a.time)
.localeCompare(b.date + b.time);

}


function changeMonth(direction) {

calendarDate.setMonth(
calendarDate.getMonth() + direction
);

renderCalendar();

}


function renderCalendar() {

const year =
calendarDate.getFullYear();

const month =
calendarDate.getMonth();

document.getElementById("monthTitle")
.textContent =
months[month] + " " + year;

const grid =
document.getElementById("calendarGrid");

grid.innerHTML = "";

const first =
new Date(year,month,1);

let start =
first.getDay();

start = start === 0 ? 6 : start - 1;

const days =
new Date(year,month+1,0).getDate();


for (let i=0; i<start; i++) {

const cell =
document.createElement("div");

cell.className = "day";

cell.innerHTML = "";

grid.appendChild(cell);

}


for (let d=1; d<=days; d++) {

const date =
new Date(year,month,d);

const value =
dateString(date);

const cell =
document.createElement("div");

cell.className = "day";

if (value === today()) {

cell.classList.add("today-day");

}


cell.innerHTML =
`<div class="day-number">${d}</div>`;


tasks
.filter(t => !t.completed && t.date === value)
.slice(0,3)
.forEach(task => {

const div =
document.createElement("div");

div.className =
"dot " + task.priority;

div.textContent =
task.text;

cell.appendChild(div);

});


grid.appendChild(cell);

}


while (grid.children.length < 42) {

const cell =
document.createElement("div");

cell.className = "day";

grid.appendChild(cell);

}


renderMonthTasks();

}


function renderMonthTasks() {

const container =
document.getElementById("monthTasks");

const prefix =
calendarDate.getFullYear() +
"-" +
String(calendarDate.getMonth()+1).padStart(2,"0");


const list =
tasks
.filter(t =>
!t.completed &&
t.date &&
t.date.startsWith(prefix)
)
.sort(sortTasks);


container.innerHTML =
list.length
? list.map(t => taskHTML(t)).join("")
: `<div class="empty">Задач в этом месяце нет.</div>`;

}


function renderCompleted() {

const container =
document.getElementById("completedTasks");

const list =
tasks
.filter(t => t.completed)
.reverse();


container.innerHTML =
list.length
? list.map(t => taskHTML(t,true)).join("")
: `<div class="empty">Выполненных задач пока нет.</div>`;

}


function clearCompleted() {

if (!confirm("Очистить историю выполненных задач?"))
return;

tasks =
tasks.filter(t => !t.completed);

save();

render();

showToast("История очищена");

}


function renderProfile() {

document.getElementById("totalCount")
.textContent = tasks.length;

document.getElementById("doneCount")
.textContent =
tasks.filter(t => t.completed).length;

document.getElementById("importantCount")
.textContent =
tasks.filter(t =>
!t.completed &&
t.priority === "important"
).length;

}


function updateDates() {

const now = new Date();

document.getElementById("headerDate")
.textContent =
now.getDate() + " " +
genitive[now.getMonth()] + " " +
now.getFullYear();

document.getElementById("todayDate")
.textContent =
now.getDate() + " " +
genitive[now.getMonth()];

}


function showToast(message) {

const toast =
document.getElementById("toast");

toast.textContent = message;

toast.classList.add("show");

setTimeout(() => {

toast.classList.remove("show");

},2200);

}


function render() {

updateDates();

renderToday();

renderCategory();

renderCalendar();

renderCompleted();

renderProfile();

}


render();

</script>

</body>
</html>
